name: "🤖 Gate 2 — Dev Agent + Review"

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  develop:
    name: Generate Implementation & Review
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'spec/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Extract issue number
        id: issue
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "number=${BRANCH#spec/issue-}" >> "$GITHUB_OUTPUT"

      - name: Post "Phase 2 starting" comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          {
            echo "## 🛠️ Dev Agent Starting — Gate 2"
            echo ""
            echo "Spec approved. Generating the implementation now."
            echo ""
            echo "The feature PR will appear shortly with:"
            echo "- ✅ Working Express API and UI"
            echo "- 🔍 Automated code review findings"
            echo ""
            echo "*Gate 2 of 3 — Implementation Review*"
          } | gh issue comment "${ISSUE_NUMBER}" --repo ${{ github.repository }} --body-file -

      - name: Checkout main (with merged spec)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run Dev Agent
        env:
          SPEC_PATH: specs/issue-${{ steps.issue.outputs.number }}.md
          OUTPUT_DIR: .
        run: |
          node scripts/dev-agent.mjs
          echo "issue-${{ steps.issue.outputs.number }}" > app/.pipeline-run

      - name: Create feature branch and open PR
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          SPEC_TITLE: ${{ github.event.pull_request.title }}
        run: |
          BRANCH="feature/issue-${ISSUE_NUMBER}"
          SUMMARY=$(cat .dev-agent-summary.txt 2>/dev/null || echo "Implementation generated by Dev Agent")
          FEATURE_TITLE="${SPEC_TITLE#Spec: }"

          git config user.name "ae-demo-bot[bot]"
          git config user.email "ae-demo-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/
          git status

          printf 'feat: implement feature for #%s\n\nAuto-generated by Dev Agent from SPEC.md.\n\n%s' \
            "${ISSUE_NUMBER}" "${SUMMARY}" > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push origin "$BRANCH"

          {
            echo "## 🤖 Dev Agent — Gate 2"
            echo ""
            echo "This implementation was auto-generated from SPEC.md by the Dev Agent."
            echo ""
            echo "${SUMMARY}"
            echo ""
            echo "Review Agent findings are posted as a comment below."
            echo ""
            echo "**Review the code and the agent findings.**"
            echo "- Approve to merge and proceed to staging"
            echo "- Request changes to trigger the Fix Agent for another round"
            echo ""
            echo "Closes #${ISSUE_NUMBER}"
          } > /tmp/pr-body.md

          PR_URL=$(gh pr create \
            --title "Feature: ${FEATURE_TITLE}" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH" \
            --label "feature")

          PR_NUMBER="${PR_URL##*/}"
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Run Review Agent
        env:
          PR_DIFF: placeholder
          SPEC_PATH: specs/issue-${{ steps.issue.outputs.number }}.md
        run: |
          git fetch origin main
          export PR_DIFF="$(git diff origin/main...HEAD -- app/ | head -c 30000)"
          node scripts/review-agent.mjs > /tmp/review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.number }}
        run: |
          {
            cat /tmp/review.md
            echo ""
            echo "---"
            echo "*Automated review by Review Agent — request changes to trigger a fix round*"
          } > /tmp/review-comment.md
          gh pr comment "${PR_NUMBER}" --body-file /tmp/review-comment.md
