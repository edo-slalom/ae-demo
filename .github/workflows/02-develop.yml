name: "🤖 Gate 2 — Dev Agent + Review"

on:
  pull_request_review:
    types: [submitted]

jobs:
  develop:
    name: Generate Implementation & Review
    if: >
      github.event.review.state == 'approved' &&
      startsWith(github.event.pull_request.head.ref, 'spec/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Merge spec PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --merge

      - name: Checkout main (with merged spec)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract issue number from branch name
        id: issue
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          ISSUE_NUMBER="${BRANCH#spec/issue-}"
          echo "number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Run Dev Agent
        env:
          SPEC_PATH: specs/issue-${{ steps.issue.outputs.number }}.md
          OUTPUT_DIR: .
        run: |
          node scripts/dev-agent.mjs
          echo "issue-${{ steps.issue.outputs.number }}" > app/.pipeline-run

      - name: Create feature branch and open PR
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          SPEC_TITLE: ${{ github.event.pull_request.title }}
        run: |
          BRANCH="feature/issue-${ISSUE_NUMBER}"
          SUMMARY=$(cat .dev-agent-summary.txt 2>/dev/null || echo "Implementation generated by Dev Agent")
          FEATURE_TITLE="${SPEC_TITLE#Spec: }"

          git config user.name "ae-demo-bot[bot]"
          git config user.email "ae-demo-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/
          git status

          printf 'feat: implement feature for #%s\n\nAuto-generated by Dev Agent from SPEC.md.\n\n%s' \
            "${ISSUE_NUMBER}" "${SUMMARY}" > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push origin "$BRANCH"

          {
            echo "## 🤖 Dev Agent — Gate 2"
            echo ""
            echo "This implementation was auto-generated from SPEC.md by the Dev Agent."
            echo ""
            echo "${SUMMARY}"
            echo ""
            echo "Review Agent findings will be posted as a comment below."
            echo ""
            echo "**Review the code and the agent findings before approving.**"
            echo ""
            echo "Closes #${ISSUE_NUMBER}"
          } > /tmp/pr-body.md

          PR_URL=$(gh pr create \
            --title "Feature: ${FEATURE_TITLE}" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH" \
            --label "feature")

          PR_NUMBER="${PR_URL##*/}"
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Run Review Agent
        env:
          PR_DIFF: placeholder
          SPEC_PATH: specs/issue-${{ steps.issue.outputs.number }}.md
        run: |
          git fetch origin main
          export PR_DIFF="$(git diff origin/main...HEAD -- app/ | head -c 30000)"
          node scripts/review-agent.mjs > /tmp/review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.number }}
        run: |
          {
            cat /tmp/review.md
            echo ""
            echo "---"
            echo "*Automated review by Review Agent — Gate 2 of 3*"
          } > /tmp/review-comment.md
          gh pr comment "${PR_NUMBER}" --body-file /tmp/review-comment.md
