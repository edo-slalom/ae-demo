name: "🤖 Gate 2 — Dev Agent"

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  develop:
    name: Generate Implementation
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'spec/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout main (with merged SPEC.md)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install script dependencies
        run: cd scripts && npm install

      - name: Extract issue number from branch name
        id: issue
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          ISSUE_NUMBER="${BRANCH#spec/issue-}"
          echo "number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Run Dev Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPEC_PATH: SPEC.md
          OUTPUT_DIR: .
        run: node scripts/dev-agent.mjs

      - name: Create feature branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          SPEC_TITLE: ${{ github.event.pull_request.title }}
        run: |
          BRANCH="feature/issue-${ISSUE_NUMBER}"
          SUMMARY=$(cat .dev-agent-summary.txt 2>/dev/null || echo "Implementation generated by Dev Agent")

          git config user.name "ae-demo-bot[bot]"
          git config user.email "ae-demo-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/
          git status
          git commit -m "feat: implement feature for #${ISSUE_NUMBER}

Auto-generated by Dev Agent from SPEC.md.

${SUMMARY}"
          git push origin "$BRANCH"

          gh pr create \
            --title "Feature: ${SPEC_TITLE#Spec: }" \
            --body "## 🤖 Dev Agent — Gate 2

This implementation was auto-generated from SPEC.md by the Dev Agent.

${SUMMARY}

The Review Agent will post its findings as a PR comment automatically.

**Review the code and the agent review findings before approving.**

Closes #${ISSUE_NUMBER}" \
            --base main \
            --head "$BRANCH" \
            --label "feature"
