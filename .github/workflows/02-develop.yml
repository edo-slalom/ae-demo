name: "🤖 Gate 2 — Dev Agent"

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  develop:
    name: Generate Implementation
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'spec/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout main (with merged SPEC.md)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract issue number from branch name
        id: issue
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          ISSUE_NUMBER="${BRANCH#spec/issue-}"
          echo "number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Run Dev Agent
        env:
          SPEC_PATH: specs/issue-${{ steps.issue.outputs.number }}.md
          OUTPUT_DIR: .
        run: node scripts/dev-agent.mjs

      - name: Create feature branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          SPEC_TITLE: ${{ github.event.pull_request.title }}
        run: |
          BRANCH="feature/issue-${ISSUE_NUMBER}"
          SUMMARY=$(cat .dev-agent-summary.txt 2>/dev/null || echo "Implementation generated by Dev Agent")
          FEATURE_TITLE="${SPEC_TITLE#Spec: }"

          git config user.name "ae-demo-bot[bot]"
          git config user.email "ae-demo-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app/
          git status

          printf 'feat: implement feature for #%s\n\nAuto-generated by Dev Agent from SPEC.md.\n\n%s' \
            "${ISSUE_NUMBER}" "${SUMMARY}" > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push origin "$BRANCH"

          {
            echo "## 🤖 Dev Agent — Gate 2"
            echo ""
            echo "This implementation was auto-generated from SPEC.md by the Dev Agent."
            echo ""
            echo "${SUMMARY}"
            echo ""
            echo "The Review Agent will post its findings as a PR comment automatically."
            echo ""
            echo "**Review the code and the agent review findings before approving.**"
            echo ""
            echo "Closes #${ISSUE_NUMBER}"
          } > /tmp/pr-body.md

          gh pr create \
            --title "Feature: ${FEATURE_TITLE}" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH" \
            --label "feature"
