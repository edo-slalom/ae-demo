name: "🤖 Gate 1 — Spec Agent"

on:
  issues:
    types: [labeled]

jobs:
  spec:
    name: Generate Technical Specification
    if: github.event.label.name == 'needs-spec'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install script dependencies
        run: cd scripts && npm install

      - name: Run Spec Agent
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          OUTPUT_PATH: SPEC.md
        run: node scripts/spec-agent.mjs

      - name: Commit spec to new branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BRANCH="spec/issue-${ISSUE_NUMBER}"

          git config user.name "ae-demo-bot[bot]"
          git config user.email "ae-demo-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add SPEC.md
          git commit -m "spec: auto-generate technical specification for #${ISSUE_NUMBER}"
          git push origin "$BRANCH"

          {
            echo "## 🤖 Spec Agent — Gate 1"
            echo ""
            echo "This specification was auto-generated from issue #${ISSUE_NUMBER} by the Spec Agent."
            echo ""
            echo "**Review the spec carefully before approving.** Once merged, the Dev Agent will automatically begin implementation."
            echo ""
            echo "### How to review"
            echo "- [ ] Does the spec accurately capture the requirements from the issue?"
            echo "- [ ] Are the API contracts sensible?"
            echo "- [ ] Are the acceptance criteria testable?"
            echo "- [ ] Is out-of-scope clearly defined?"
            echo ""
            echo "Closes #${ISSUE_NUMBER}"
          } > /tmp/pr-body.md

          PR_URL=$(gh pr create \
            --title "Spec: ${ISSUE_TITLE}" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH" \
            --label "spec")

          {
            echo "## 🤖 Spec Agent Complete"
            echo ""
            echo "I've analyzed your feature request and generated a technical specification."
            echo ""
            echo "**[→ Review Spec PR](${PR_URL})**"
            echo ""
            echo "Once you approve and merge the spec, development begins automatically."
            echo ""
            echo "*Gate 1 of 3 — Spec Approval*"
          } | gh issue comment "${ISSUE_NUMBER}" --body-file -
