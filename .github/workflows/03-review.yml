name: "🤖 Review Agent"

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  review:
    name: Automated Code Review
    if: false  # review runs inside 02-develop.yml to avoid bot-PR workflow approval prompts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin main
          git diff origin/main...HEAD -- app/ | head -c 30000 > /tmp/pr-diff.txt
          echo "Diff lines: $(wc -l < /tmp/pr-diff.txt)"

      - name: Run Review Agent
        env:
          PR_DIFF: placeholder
          SPEC_PATH: SPEC.md
        run: |
          export PR_DIFF="$(cat /tmp/pr-diff.txt)"
          node scripts/review-agent.mjs > /tmp/review.md
          echo "Review lines: $(wc -l < /tmp/review.md)"

      - name: Post review as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            cat /tmp/review.md
            echo ""
            echo "---"
            echo "*Automated review by Review Agent — Gate 2 of 3*"
          } > /tmp/review-comment.md
          gh pr comment "${PR_NUMBER}" --body-file /tmp/review-comment.md
